name: Personal fork release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/personal-release.yml
      - scripts/personal-release.py
      - scripts/personal-release.test.py
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      arm64_server_only:
        description: Build only the ARM64 server runtime for local release assembly
        type: boolean
        default: false
concurrency:
  group: personal-fork-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'RicardoNid/t3code'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      needed: ${{ steps.candidate.outputs.needed }}
      ref: ${{ steps.candidate.outputs.ref }}
      base: ${{ steps.candidate.outputs.base }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PERSONAL_RELEASE_SSH_KEY }}
      - name: Controller regression tests
        run: python3 scripts/personal-release.test.py
      - name: Resolve and merge stable upstream
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the recipe outside the candidate checkout it creates.
          mkdir -p "$RUNNER_TEMP/controller/scripts" "$RUNNER_TEMP/controller/.github/workflows"
          cp scripts/personal-release.py "$RUNNER_TEMP/controller/scripts/"
          cp .github/workflows/personal-release.yml "$RUNNER_TEMP/controller/.github/workflows/"
          python3 "$RUNNER_TEMP/controller/scripts/personal-release.py" resolve
  validate:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci-deps
      - name: Native test prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Browser test dependencies
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Affected checks and personal behavior regressions
        env:
          PERSONAL_BASE: ${{ needs.resolve.outputs.base }}
        run: |
          vp run check:changed "$PERSONAL_BASE"
          vp test run apps/web/src/sidebarPersonalization.test.ts apps/web/src/components/sidebar/deviceScope.test.ts packages/source-control-forgejo/src/server/forgejoPullRequests.test.ts packages/source-control-forgejo/src/server/ForgejoSourceControlProvider.test.ts packages/ssh/src/tunnel.launch.test.ts
  build:
    needs: [resolve, validate]
    if: needs.resolve.outputs.needed == 'true' && inputs.arm64_server_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
            suffix: arm64.dmg
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
            suffix: amd64.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      T3CODE_WEB_SOURCEMAP: "0"
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .personal-controller
          sparse-checkout: scripts/personal-release.py
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/monorepo --filter @t3tools/web... --filter t3... --filter @t3tools/desktop... --filter ./oxlint-plugin-t3code... --filter ./scripts...
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick patchelf libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Build only the requested architecture
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$PLATFORM" = mac ]; then test "$(uname -m)" = arm64; fi
          vp run dist:desktop:artifact --platform "$PLATFORM" --target "$TARGET" --arch "$ARCH" --build-version "$VERSION" --output-dir "$RUNNER_TEMP/packages"
      - name: Sign Apple Silicon app and rebuild its DMG
        if: matrix.platform == 'mac'
        run: |
          stage="$RUNNER_TEMP/personal-sign.noindex"
          mkdir "$stage"
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k "$RUNNER_TEMP/packages/T3-Code-$VERSION-arm64.zip" "$stage"
          cat > "$RUNNER_TEMP/personal-entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.cs.allow-jit</key><true/>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - --entitlements "$RUNNER_TEMP/personal-entitlements.plist" "$stage/T3 Code (Beta).app"
          codesign --verify --deep --strict "$stage/T3 Code (Beta).app"
          rm "$RUNNER_TEMP/packages/T3-Code-$VERSION-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$stage/T3 Code (Beta).app" "$RUNNER_TEMP/packages/T3-Code-$VERSION-arm64.zip"
          ln -s /Applications "$stage/Applications"
          hdiutil create -ov -volname 'T3 Code Personal' -srcfolder "$stage" -format UDZO "$RUNNER_TEMP/packages/T3-Code-$VERSION-arm64.dmg"
      - name: Verify installer
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = mac ]; then
            hdiutil verify "$RUNNER_TEMP/packages/T3-Code-$VERSION-arm64.dmg"
          else
            test "$(dpkg-deb -f "$RUNNER_TEMP/packages/T3-Code-$VERSION-amd64.deb" Architecture)" = amd64
          fi
      - name: Launch the shipped DMG in an isolated home
        if: matrix.platform == 'mac'
        run: |
          mount="$RUNNER_TEMP/launch-mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/packages/T3-Code-$VERSION-arm64.dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          node scripts/smoke-desktop-app.ts --executable "$mount/T3 Code (Beta).app/Contents/MacOS/T3 Code (Beta)" --artifacts-dir "$RUNNER_TEMP/launch-check"
      - name: Build and test the self-contained server updater payload
        env:
          PLATFORM: ${{ matrix.platform }}
          RESOURCE_KEY: ${{ matrix.platform == 'mac' && 'darwin-arm64' || 'linux-x64' }}
          RUST_TARGET: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/$RESOURCE_KEY"
          cp "native/resource-monitor/target/$RUST_TARGET/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/$RESOURCE_KEY/"
          node scripts/build-cli-archive.ts --platform "$PLATFORM" --arch "${{ matrix.arch }}" --version "$VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir "$RUNNER_TEMP/packages"
          node scripts/smoke-cli-archive.ts --archive "$RUNNER_TEMP/packages/t3-$VERSION-$RESOURCE_KEY.tar.gz" --expect-version "$VERSION"
      - name: Prepare final update metadata
        run: python3 .personal-controller/scripts/personal-release.py prepare-feed --directory "$RUNNER_TEMP/packages" --version "$VERSION" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/packages/T3-Code-*.dmg
            ${{ runner.temp }}/packages/T3-Code-*.zip
            ${{ runner.temp }}/packages/T3-Code-*.deb
            ${{ runner.temp }}/packages/T3-Code-x86_64.AppImage
            ${{ runner.temp }}/packages/t3-*.tar.gz
            ${{ runner.temp }}/packages/latest-*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  ubuntu_launch:
    needs: [resolve, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/scripts...
      - uses: actions/download-artifact@v6
        with:
          name: installer-linux-x64
          path: installers
      - name: Launch the shipped DEB on Ubuntu 26.04
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          test "$(. /etc/os-release; echo "$VERSION_ID")" = '26.04'
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libsecret-1-0
          dpkg-deb -x "installers/T3-Code-$VERSION-amd64.deb" "$RUNNER_TEMP/unpacked"
          xvfb-run -a node scripts/smoke-desktop-app.ts --executable "$RUNNER_TEMP/unpacked/opt/T3 Code (Beta)/t3code" --artifacts-dir "$RUNNER_TEMP/launch-check"
  arm64_server:
    needs: [resolve, validate]
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      VERSION: ${{ needs.resolve.outputs.version }}
      APP_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/monorepo --filter @t3tools/web... --filter t3... --filter @t3tools/desktop... --filter ./oxlint-plugin-t3code... --filter ./scripts...
      - uses: dtolnay/rust-toolchain@stable
      - name: ARM64 build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config patchelf
      - name: Build and test only the ARM64 server archive
        run: |
          test "$(uname -m)" = aarch64
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run --filter @t3tools/web build
          vp run --filter t3 build
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-arm64"
          cp native/resource-monitor/target/aarch64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-arm64/"
          node scripts/build-cli-archive.ts --platform linux --arch arm64 --version "$VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir "$RUNNER_TEMP/packages"
          node scripts/smoke-cli-archive.ts --archive "$RUNNER_TEMP/packages/t3-$VERSION-linux-arm64.tar.gz" --expect-version "$VERSION"
      - name: Bundle the isolated verification helper
        run: |
          mkdir verify
          vp exec --filter @t3tools/scripts -- esbuild "$GITHUB_WORKSPACE/scripts/smoke-cli-archive.ts" --bundle --platform=node --format=esm --target=node24 --banner:js='import { createRequire } from "node:module"; const require = createRequire(import.meta.url);' --outfile="$GITHUB_WORKSPACE/verify/smoke-cli-archive.mjs"
      - uses: actions/upload-artifact@v6
        with:
          name: installer-linux-arm64-server
          path: ${{ runner.temp }}/packages/t3-${{ needs.resolve.outputs.version }}-linux-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v6
        with:
          name: verification-linux-arm64
          path: verify/smoke-cli-archive.mjs
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [resolve, validate, build, ubuntu_launch, arm64_server]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PERSONAL_RELEASE_SSH_KEY }}
      - uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish only verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.resolve.outputs.ref }}
        run: python3 scripts/personal-release.py publish --ref "$CANDIDATE" --directory installers
